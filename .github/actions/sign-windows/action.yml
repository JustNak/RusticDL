name: Sign Windows PE files
description: Azure Trusted Signing (OIDC) plus Authenticode Status=Valid check. Does not publish.

inputs:
  files:
    description: Newline- or comma-separated absolute paths to sign
    required: true
  azure-client-id:
    description: App Registration application (client) ID
    required: true
  azure-tenant-id:
    description: Azure AD tenant ID
    required: true
  azure-subscription-id:
    description: Azure subscription ID
    required: true
  endpoint:
    description: Trusted Signing regional endpoint URI
    required: true
  account:
    description: Trusted Signing account name
    required: true
  profile:
    description: Public-trust certificate profile name
    required: true

runs:
  using: composite
  steps:
    - name: Azure login (OIDC)
      uses: azure/login@v2.3.0
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Sign with Trusted Signing
      uses: Azure/trusted-signing-action@v2.0.0
      with:
        endpoint: ${{ inputs.endpoint }}
        trusted-signing-account-name: ${{ inputs.account }}
        certificate-profile-name: ${{ inputs.profile }}
        files: ${{ inputs.files }}
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        exclude-environment-credential: true

    - name: Verify Authenticode Status Valid
      shell: pwsh
      env:
        SIGN_FILES: ${{ inputs.files }}
      run: |
        $ErrorActionPreference = "Stop"
        $paths = @()
        foreach ($part in ($env:SIGN_FILES -split "[\r\n,]+")) {
          $trimmed = $part.Trim()
          if ($trimmed.Length -gt 0) {
            $paths += $trimmed
          }
        }
        if ($paths.Count -eq 0) {
          throw "sign-windows: no files were given to verify."
        }
        foreach ($path in $paths) {
          if (-not (Test-Path -LiteralPath $path)) {
            throw "sign-windows: signed file missing: $path"
          }
          $sig = Get-AuthenticodeSignature -LiteralPath $path
          if ($sig.Status -ne "Valid") {
            throw "sign-windows: Authenticode Status is '$($sig.Status)' (expected Valid) for $path. $($sig.StatusMessage)"
          }
          Write-Host "Authenticode Valid: $path"
        }
