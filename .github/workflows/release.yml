name: Release

on:
  push:
    tags:
      - "v*"
      # Nightlies use vX.Y.Z-nightly.STAMP (see nightly.yml). Do not republish them as Stable.
      - "!v*-nightly.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --cfg reqwest_unstable

jobs:
  release-windows:
    name: Build & publish (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Build Rust release binaries
        run: |
          cargo build --release -p rusticdl
          cargo build --release -p rusticdl-updater
          cargo build --release -p rusticdl-native-host

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build browser extension
        working-directory: apps/extension
        run: |
          npm ci
          npm run build

      - name: Package release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -ExecutionPolicy Bypass -File scripts/package-release-assets.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          prerelease: false
          files: |
            dist-release/RusticDL-windows-x64-setup.exe
            dist-release/RusticDL-windows-x64.zip
            dist-release/RusticDL-full-windows-x64.zip
            dist-release/extension-chromium.zip
            dist-release/extension-firefox.zip
          body: |
            ## RusticDL ${{ github.ref_name }}

            Local-first HTTP(S) download manager for Windows.

            ### Downloads
            | Asset | Contents |
            | --- | --- |
            | **RusticDL-windows-x64-setup.exe** | **Recommended** — NSIS installer (app + native host + browser host registration) |
            | **RusticDL-windows-x64.zip** | Portable desktop app only |
            | **RusticDL-full-windows-x64.zip** | Portable app + native host + scripts + extensions |
            | **extension-chromium.zip** | Chromium / Edge / Brave extension |
            | **extension-firefox.zip** | Firefox extension |

            ### Quick start
            1. Download **RusticDL-windows-x64-setup.exe**
            2. Run the installer (per-user, no admin required)
            3. Launch RusticDL from the Start Menu

            Browser handoff still requires loading the extension (see README). The installer registers the native messaging host automatically.

            See the [README](https://github.com/JustNak/RusticDL#readme) for portable ZIP and build-from-source docs.

            **License:** MIT — commercial use allowed; keep attribution (copyright notice).
