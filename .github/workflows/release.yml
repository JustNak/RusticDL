name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --cfg reqwest_unstable

jobs:
  release-windows:
    name: Build & publish (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Build Rust release binaries
        run: |
          cargo build --release -p rusticdl
          cargo build --release -p rusticdl-updater
          cargo build --release -p rusticdl-native-host

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build browser extension
        working-directory: apps/extension
        run: |
          npm ci
          npm run build

      - name: Package release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist-release"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # NSIS installer (recommended for most users)
          cargo packager --release --formats nsis -p rusticdl
          $setup = Get-ChildItem -Path $dist -Filter "*-setup.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) {
            throw "NSIS setup.exe not found under $dist"
          }
          Copy-Item -Force $setup.FullName "$dist/RusticDL-windows-x64-setup.exe"
          Write-Host "Packed RusticDL-windows-x64-setup.exe ($([math]::Round((Get-Item "$dist/RusticDL-windows-x64-setup.exe").Length / 1MB, 2)) MB)"

          # App-only zip (portable)
          $appDir = Join-Path $dist "app"
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          Copy-Item "target/release/rusticdl.exe" $appDir
          Copy-Item "target/release/rusticdl-updater.exe" $appDir
          Copy-Item "LICENSE" $appDir
          Copy-Item "README.md" $appDir
          Compress-Archive -Path (Join-Path $appDir "*") -DestinationPath "$dist/RusticDL-windows-x64.zip" -Force

          # Extension zips
          Compress-Archive -Path "apps/extension/dist/chromium/*" -DestinationPath "$dist/extension-chromium.zip" -Force
          Compress-Archive -Path "apps/extension/dist/firefox/*" -DestinationPath "$dist/extension-firefox.zip" -Force

          # Full package (portable)
          $fullDir = Join-Path $dist "full"
          New-Item -ItemType Directory -Force -Path $fullDir | Out-Null
          Copy-Item "target/release/rusticdl.exe" $fullDir
          Copy-Item "target/release/rusticdl-updater.exe" $fullDir
          Copy-Item "target/release/rusticdl-native-host.exe" $fullDir
          Copy-Item "LICENSE" $fullDir
          Copy-Item "README.md" $fullDir
          New-Item -ItemType Directory -Force -Path (Join-Path $fullDir "scripts") | Out-Null
          Copy-Item "scripts/register-native-host.ps1" (Join-Path $fullDir "scripts")
          Copy-Item "scripts/unregister-native-host.ps1" (Join-Path $fullDir "scripts")
          # Templates used by the register script (relative to apps/native-host when not bundled)
          $nativeManifests = "apps/native-host/manifests"
          if (Test-Path $nativeManifests) {
            Copy-Item "$nativeManifests/*" (Join-Path $fullDir "scripts") -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $fullDir "extension/chromium") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $fullDir "extension/firefox") | Out-Null
          Copy-Item "apps/extension/dist/chromium/*" (Join-Path $fullDir "extension/chromium") -Recurse
          Copy-Item "apps/extension/dist/firefox/*" (Join-Path $fullDir "extension/firefox") -Recurse
          Compress-Archive -Path (Join-Path $fullDir "*") -DestinationPath "$dist/RusticDL-full-windows-x64.zip" -Force

          Get-ChildItem $dist -Filter *.zip | ForEach-Object {
            Write-Host "Packed $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/RusticDL-windows-x64-setup.exe
            dist-release/RusticDL-windows-x64.zip
            dist-release/RusticDL-full-windows-x64.zip
            dist-release/extension-chromium.zip
            dist-release/extension-firefox.zip
          body: |
            ## RusticDL ${{ github.ref_name }}

            Local-first HTTP(S) download manager for Windows.

            ### Downloads
            | Asset | Contents |
            | --- | --- |
            | **RusticDL-windows-x64-setup.exe** | **Recommended** — NSIS installer (app + native host + browser host registration) |
            | **RusticDL-windows-x64.zip** | Portable desktop app only |
            | **RusticDL-full-windows-x64.zip** | Portable app + native host + scripts + extensions |
            | **extension-chromium.zip** | Chromium / Edge / Brave extension |
            | **extension-firefox.zip** | Firefox extension |

            ### Quick start
            1. Download **RusticDL-windows-x64-setup.exe**
            2. Run the installer (per-user, no admin required)
            3. Launch RusticDL from the Start Menu

            Browser handoff still requires loading the extension (see README). The installer registers the native messaging host automatically.

            See the [README](https://github.com/JustNak/RusticDL#readme) for portable ZIP and build-from-source docs.

            **License:** MIT — commercial use allowed; keep attribution (copyright notice).
