name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --cfg reqwest_unstable

jobs:
  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # Advisory for now: the codebase has pre-existing style lints.
        # Fail only on hard errors; tighten to `-D warnings` later.
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  rust-linux:
    name: Rust (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++6 g++ libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          cargo test --workspace -- \
            --skip v1_map_is_committed_before_set_len

      - name: Build rusticdl release
        run: cargo build --release -p rusticdl

      - name: Verify ELF
        run: |
          file target/release/rusticdl
          readelf -h target/release/rusticdl
          readelf -h target/release/rusticdl | grep -q 'Class: *ELF64'
          readelf -h target/release/rusticdl | grep -Eq 'Type: *(EXEC|DYN)'
          test -x target/release/rusticdl

      - name: Upload rusticdl artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusticdl-linux-x64
          path: target/release/rusticdl

  extension:
    name: Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test capture heuristics
        run: npm test

      - name: Build
        run: npm run build
