<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RusticDL</title>
    <script src="./appearance-preload.js"></script>
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body class="popup-page">
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand-lockup">
          <img class="brand-icon" src="./icons/icon-32.png" alt="" />
          <div class="brand-text">
            <h1>
              RusticDL
              <span id="connection-status" class="connection-dot checking" aria-hidden="true"></span>
              <span id="connection-status-label" class="visually-hidden">Checking connection</span>
            </h1>
            <p>Browser handoff</p>
          </div>
        </div>
        <div class="popup-icon-actions">
          <button id="open-app-button" type="button" class="icon-action" title="Open RusticDL" aria-label="Open RusticDL" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
              <path d="M15 3h6v6" />
              <path d="M10 14 21 3" />
            </svg>
          </button>
          <button id="sync-button" type="button" class="icon-action" title="Sync status" aria-label="Sync status">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 0 1-15.1 6.6" />
              <path d="M3 12A9 9 0 0 1 18.1 5.4" />
              <path d="M18 2v4h-4" />
              <path d="M6 22v-4h4" />
            </svg>
          </button>
          <button id="advanced-button" type="button" class="icon-action" title="Options" aria-label="Open options">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </header>

      <section class="control">
        <div>
          <div class="label">Silent download</div>
          <div class="hint">Auto-send without a prompt</div>
        </div>
        <label class="switch" for="silent-download-toggle">
          <input id="silent-download-toggle" type="checkbox" />
          <span class="track"></span>
          <span class="thumb"></span>
        </label>
      </section>

      <section class="control">
        <div>
          <div class="label">Capture downloads</div>
          <div class="hint">Intercept browser downloads</div>
        </div>
        <label class="switch" for="extension-enabled-toggle">
          <input id="extension-enabled-toggle" type="checkbox" />
          <span class="track"></span>
          <span class="thumb"></span>
        </label>
      </section>

      <div id="status-line" class="status-line" role="status" aria-live="polite">
        Checking desktop connection…
      </div>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
