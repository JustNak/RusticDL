<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RusticDL</title>
    <script src="./appearance-preload.js"></script>
    <link rel="stylesheet" href="./theme.css" />
    <style>
      body.popup-page { width: 320px; margin: 0; }
      .popup-shell { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
      .popup-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .brand-lockup { display: flex; gap: 10px; align-items: center; }
      .brand-icon { width: 32px; height: 32px; border-radius: 8px; }
      .brand-text h1 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 6px; }
      .brand-text p { margin: 2px 0 0; font-size: 11px; color: var(--color-muted-foreground); }
      .connection-dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; background: #94a3b8; }
      .connection-dot.connected { background: #16a34a; }
      .connection-dot.error,
      .connection-dot.host_missing,
      .connection-dot.app_missing,
      .connection-dot.app_unreachable { background: #dc2626; }
      .connection-dot.checking { background: #f59e0b; }
      .control {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        padding: 10px 12px; border: 1px solid var(--color-border);
        border-radius: var(--radius-md); background: var(--color-card);
      }
      .label { font-size: 13px; font-weight: 600; }
      .hint { font-size: 11px; color: var(--color-muted-foreground); margin-top: 2px; }
      .icon-action {
        width: 32px; height: 32px; display: grid; place-items: center;
        border: 1px solid var(--color-border); background: var(--color-muted);
        color: var(--color-foreground); border-radius: 8px; cursor: pointer; padding: 0;
      }
      .icon-action:hover { color: var(--color-foreground); background: var(--color-row-hover); }
      .icon-action svg {
        width: 16px; height: 16px; fill: none; stroke: currentColor;
        stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      }
      .switch { position: relative; width: 40px; height: 22px; display: inline-block; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .track { position: absolute; inset: 0; background: var(--color-input); border-radius: 999px; transition: .15s; }
      .thumb {
        position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
        background: white; border-radius: 999px; transition: .15s;
      }
      .switch input:checked + .track { background: var(--color-primary); }
      .switch input:checked + .track + .thumb { transform: translateX(18px); }
      .popup-icon-actions { display: flex; gap: 6px; }
      .status-line { font-size: 11px; color: var(--color-muted-foreground); white-space: pre-wrap; }
      .icon-action:disabled { opacity: 0.55; cursor: default; }
    </style>
  </head>
  <body class="popup-page">
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand-lockup">
          <img class="brand-icon" src="./icons/icon-32.png" alt="" />
          <div class="brand-text">
            <h1>
              RusticDL
              <span id="connection-status" class="connection-dot checking" aria-hidden="true"></span>
              <span id="connection-status-label" class="visually-hidden">Checking connection</span>
            </h1>
            <p>Browser handoff</p>
          </div>
        </div>
        <div class="popup-icon-actions">
          <button id="sync-button" type="button" class="icon-action" title="Sync status" aria-label="Sync status">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 0 1-15.1 6.6" />
              <path d="M3 12A9 9 0 0 1 18.1 5.4" />
              <path d="M18 2v4h-4" />
              <path d="M6 22v-4h4" />
            </svg>
          </button>
          <button id="advanced-button" type="button" class="icon-action" title="Options" aria-label="Open options">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </header>

      <section class="control">
        <div>
          <div class="label">Silent download</div>
          <div class="hint">Auto-send without a prompt</div>
        </div>
        <label class="switch" for="silent-download-toggle">
          <input id="silent-download-toggle" type="checkbox" />
          <span class="track"></span>
          <span class="thumb"></span>
        </label>
      </section>

      <section class="control">
        <div>
          <div class="label">Capture downloads</div>
          <div class="hint">Intercept browser downloads</div>
        </div>
        <label class="switch" for="extension-enabled-toggle">
          <input id="extension-enabled-toggle" type="checkbox" />
          <span class="track"></span>
          <span class="thumb"></span>
        </label>
      </section>

      <div id="status-line" class="status-line" role="status" aria-live="polite">
        Checking desktop connection…
      </div>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
