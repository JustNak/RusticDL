[package]
name = "rusticdl-native-host"
version = "0.1.3"
edition = "2021"
description = "RusticDL Backend — native messaging host for browser extensions"
license = "MIT"
repository = "https://github.com/JustNak/RusticDL"
authors = ["JustNak"]

[package.metadata.winresource]
ProductName = "RusticDL"
FileDescription = "RusticDL Backend"
CompanyName = "JustNak"
LegalCopyright = "Copyright (c) JustNak"
OriginalFilename = "rusticdl-native-host.exe"

[[bin]]
name = "rusticdl-native-host"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
