[workspace]
members = [".", "apps/native-host"]
resolver = "2"

[package]
name = "rusticdl"
version = "0.1.2"
edition = "2021"
description = "RusticDL — a simple local-first HTTP download manager"
license = "MIT"
repository = "https://github.com/JustNak/RusticDL"
homepage = "https://github.com/JustNak/RusticDL"
readme = "README.md"
authors = ["JustNak"]
keywords = ["download-manager", "http", "gpui", "windows"]
categories = ["network-programming", "gui"]

[package.metadata.winresource]
ProductName = "RusticDL"
FileDescription = "RusticDL"
CompanyName = "JustNak"
LegalCopyright = "Copyright (c) JustNak"
OriginalFilename = "rusticdl.exe"

[[bin]]
name = "rusticdl"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
async-channel = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "net", "sync", "time"] }
# http3 is unstable: requires RUSTFLAGS=--cfg reqwest_unstable (see .cargo/config.toml)
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "http3", "json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
url = "2"
open = "5"
percent-encoding = "2"
# Film-grain texture generation (RenderImage frames).
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Windows NSIS packaging via cargo-packager (v0.11.x).
# Build: cargo packager --release --formats nsis
# Or:    powershell -File scripts/package-windows.ps1
[package.metadata.packager]
product-name = "RusticDL"
identifier = "com.rusticdl.app"
publisher = "JustNak"
license-file = "LICENSE"
homepage = "https://github.com/JustNak/RusticDL"
icons = ["assets/brand/icon.ico", "assets/brand/icon-*.png"]
formats = ["nsis"]
out-dir = "dist-release"
before-packaging-command = "cargo build --release -p rusticdl -p rusticdl-native-host"
binaries = [
  { path = "rusticdl", main = true },
  { path = "rusticdl-native-host", main = false },
]
resources = [
  "LICENSE",
  { src = "scripts/register-native-host.ps1", target = "scripts/register-native-host.ps1" },
  { src = "scripts/unregister-native-host.ps1", target = "scripts/unregister-native-host.ps1" },
  { src = "apps/native-host/manifests/chromium.template.json", target = "scripts/chromium.template.json" },
  { src = "apps/native-host/manifests/edge.template.json", target = "scripts/edge.template.json" },
  { src = "apps/native-host/manifests/firefox.template.json", target = "scripts/firefox.template.json" },
]

[package.metadata.packager.nsis]
template = "installer/nsis/installer.nsi"
installer-icon = "assets/brand/icon.ico"
compression = "lzma"
appdata-paths = ["$APPDATA/RusticDL"]
